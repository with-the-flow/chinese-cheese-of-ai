name: Daily Self-Play Training (100 games)

on:
  schedule:
    - cron: '0 18 * * *'   # UTC 18:00 = 北京时间 02:00
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 100局很快，360分钟足够

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check previous weights
      id: check_weights
      run: |
        if [ -f "weights/weights_final.pt" ]; then
          echo "has_weights=true" >> $GITHUB_OUTPUT
          echo "Found existing weights"
        else
          echo "has_weights=false" >> $GITHUB_OUTPUT
          echo "No previous weights"
        fi

    - name: Create directories
      run: mkdir -p data weights

    - name: Run training (100 games)
      env:
        PYTHONUNBUFFERED: 1
      run: |
        set +e
        
        if [ "${{ steps.check_weights.outputs.has_weights }}" == "true" ]; then
          python scripts/train.py \
            --max-games 100 \
            --load-weights weights/weights_final.pt \
            --device cpu \
            --log-file train_data.log
        else
          python scripts/train.py \
            --max-games 100 \
            --device cpu \
            --log-file train_data.log
        fi
        
        EXIT_CODE=$?
        set -e
        
        if [ $EXIT_CODE -eq 0 ]; then
          echo "Training completed normally"
        else
          echo "Training failed with exit code: $EXIT_CODE"
          exit $EXIT_CODE
        fi

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: training-backup-${{ github.run_number }}-${{ github.run_attempt }}
        path: |
          train_data.log
          weights/weights_final.pt
        retention-days: 7

    - name: Commit results
      if: always()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add train_data.log weights/weights_final.pt || true
        
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update: training log & weights [run ${{ github.run_number }}]"
          git push || echo "Push failed"
        else
          echo "No changes"
        fi
